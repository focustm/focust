<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FocusT Video Test</title>
<style>html,body{margin:0;padding:0;background:#000;width:100%;min-height:100%;}#rawWsVideo{width:100%;height:auto;max-width:none!important;display:block;background:#000;}</style>
</head>
<body>
<script>
(() => {
    const MIME = 'video/mp4; codecs="avc1.42E01E"';

    alert(
    "MediaSource: " + !!window.MediaSource +
    "\nManagedMediaSource: " + !!window.ManagedMediaSource
);

    let video = document.getElementById("rawWsVideo");

    if (!video) {
        video = document.createElement("video");
        video.id = "rawWsVideo";

        video.autoplay = true;
        video.muted = true;
        video.controls = true;
        video.playsInline = true;

        video.setAttribute("playsinline","");
        video.setAttribute("webkit-playsinline","");
        video.setAttribute("muted","");

        video.style.width = "100%";
        video.style.background = "black";

        document.body.prepend(video);
    }

    console.log("Video element prepared for iPhone");
})();
</script>
</body>
</html>
